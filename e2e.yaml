version: "1"
name: "hillliu.github.io"
description: "Smoke test for the served portfolio page"
settings:
  timeout: 15000
commands:
  - command: see
    description: "app mount point exists"
    selector: "#app"
  - command: see
    description: "header rendered by React"
    selector: "#header"
    timeout: 5000
  - command: see
    description: "hero splash rendered"
    selector: ".splash-block"
    timeout: 5000
  - command: see
    description: "main bundle is referenced"
    selector: 'script[src*="main"]'
